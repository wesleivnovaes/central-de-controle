<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central de Controle</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF0;--bg-grad:radial-gradient(circle at 12% 0%, rgba(14,124,134,.08), transparent 42%), #E9EEF0;
  --panel:#F7F9FA;--panel-2:#EFF4F6;--ink:#14232B;--mute:#5E7078;
  --line:#CBD6DA;--line-soft:color-mix(in srgb,var(--line) 72%,transparent);
  --acc:#0E7C86;--acc-soft:color-mix(in srgb,var(--acc) 12%,transparent);
  --accink:#fff;--bad:#C4472F;--bad-soft:color-mix(in srgb,var(--bad) 12%,transparent);
  --ok:#2F8F4E;--shadow:0 6px 20px rgba(20,35,43,.05);--shadow-lg:0 24px 60px rgba(10,20,26,.24);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A20;--bg-grad:radial-gradient(circle at 12% 0%, rgba(63,184,196,.09), transparent 44%), #0F1A20;
    --panel:#172830;--panel-2:#1E323C;--ink:#E4EEF1;--mute:#8FA5AD;
    --line:#2A3F48;--line-soft:color-mix(in srgb,var(--line) 75%,transparent);
    --acc:#3FB8C4;--acc-soft:color-mix(in srgb,var(--acc) 15%,transparent);
    --accink:#08181C;--bad:#EE7A63;--bad-soft:color-mix(in srgb,var(--bad) 15%,transparent);
    --ok:#49B66B;--shadow:0 10px 28px rgba(0,0,0,.28);--shadow-lg:0 24px 64px rgba(0,0,0,.48);color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A20;--bg-grad:radial-gradient(circle at 12% 0%, rgba(63,184,196,.09), transparent 44%), #0F1A20;
  --panel:#172830;--panel-2:#1E323C;--ink:#E4EEF1;--mute:#8FA5AD;
  --line:#2A3F48;--line-soft:color-mix(in srgb,var(--line) 75%,transparent);
  --acc:#3FB8C4;--acc-soft:color-mix(in srgb,var(--acc) 15%,transparent);
  --accink:#08181C;--bad:#EE7A63;--bad-soft:color-mix(in srgb,var(--bad) 15%,transparent);
  --ok:#49B66B;--shadow:0 10px 28px rgba(0,0,0,.28);--shadow-lg:0 24px 64px rgba(0,0,0,.48);color-scheme:dark
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg-grad);color:var(--ink);font:400 15.5px/1.52 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit;transition:background-color .16s ease,border-color .16s ease,color .16s ease,transform .12s ease,box-shadow .16s ease}
button{cursor:pointer}
button:active{transform:scale(.99)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

body.locked #app{filter:blur(14px);pointer-events:none;user-select:none}

#app{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
aside{
  background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);
  border-right:1px solid var(--line-soft);
  padding:22px 14px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;overflow-y:auto
}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;font:700 21px 'Bricolage Grotesque',sans-serif;padding:0 8px 14px}
.theme-bar{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:10px;border:1px solid var(--line-soft)}
.theme-bar button{border:0;background:none;border-radius:7px;padding:3px 7px;font-size:11px;font-weight:600;color:var(--mute)}
.theme-bar button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.sync-badge{
  display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--mute);
  padding:7px 11px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line-soft);margin-bottom:6px
}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.sync-dot.busy{background:#D08A12;box-shadow:0 0 0 3px rgba(208,138,18,.22)}
.sync-dot.err{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}

.nav{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:1px solid transparent;border-radius:10px;padding:9px 11px;min-height:40px;font-weight:500
}
.nav:hover{background:var(--panel-2);border-color:var(--line-soft)}
.nav.on{background:var(--ink);color:var(--bg);font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.nav .dot{width:10px;height:10px;border-radius:3px;flex:none}
.nav .n{margin-left:auto;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--panel-2);color:var(--mute)}
.nav.on .n{background:rgba(255,255,255,.16);color:inherit}

.side-sep{height:1px;background:var(--line-soft);margin:8px 6px}
.ghost{
  background:none;border:1px dashed var(--line);border-radius:10px;
  padding:8px 11px;color:var(--mute);margin-top:3px;min-height:38px;font-size:13.5px;text-align:left
}
.ghost:hover{border-color:var(--acc);color:var(--ink);background:var(--acc-soft)}

main{padding:28px clamp(18px,3.2vw,44px) 64px;width:100%;min-width:0}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
.head h1{font-size:clamp(28px,4.2vw,36px);line-height:1.08}
.sub{color:var(--mute);margin:6px 0 20px;font-size:14.5px}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab,.btn{
  border:1px solid var(--line);background:var(--panel);border-radius:10px;
  padding:8px 13px;min-height:36px;font-size:13.5px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:6px
}
.tab:hover,.btn:hover{border-color:var(--mute);background:var(--panel-2)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600;box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 26%,transparent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 32%,var(--line))}
.btn.bad:hover{background:var(--bad-soft)}

.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}
.quick{display:flex;gap:8px;margin-bottom:18px}
.quick input{flex:1;min-width:0}
input,select,textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;width:100%;font-size:14.5px
}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:26px}
.stat{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;
  padding:14px 15px;text-align:left;box-shadow:var(--shadow)
}
.stat:hover{border-color:var(--acc);transform:translateY(-2px)}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:15.5px;margin-bottom:4px}
.bar{height:7px;background:var(--bg);border-radius:999px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;transition:width .25s ease}

.grp{margin-bottom:24px}
.grp h3{font-size:12.5px;color:var(--mute);margin-bottom:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.grp.late h3{color:var(--bad)}

.task{
  display:flex;gap:12px;align-items:flex-start;background:var(--panel);
  border:1px solid var(--line-soft);border-radius:13px;padding:12px 14px;margin-bottom:9px;
  box-shadow:var(--shadow)
}
.task:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.chk{
  flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--mute);
  background:none;display:grid;place-items:center;font-size:14px;line-height:1;margin-top:2px
}
.done .chk{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.tb{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.tt{font-weight:600;font-size:15px}
.done .tt{text-decoration:line-through;opacity:.55}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--mute);margin-top:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.chip i{width:9px;height:9px;border-radius:3px;display:inline-block}
.pill-tag{background:var(--panel-2);border:1px solid var(--line-soft);padding:1px 8px;border-radius:999px;font-size:11.5px}

.sublist{margin-top:8px;display:grid;gap:4px}
.subitem{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute)}
.subitem.ok{text-decoration:line-through;opacity:.65}

.th{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center}
.th img,.gal img{object-fit:cover;border-radius:8px;display:block;border:1px solid var(--line)}
.th img{width:52px;height:52px}
.pdf-chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;
  background:var(--panel-2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink);
  max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.pdf-badge{
  background:var(--bad);color:#fff;font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px;flex:none
}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gal button{padding:0;border:0;background:none;position:relative;border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.gal img{width:100%;aspect-ratio:1;border:0}
.gal span{
  position:absolute;left:6px;bottom:6px;right:6px;font-size:12px;font-weight:500;
  background:rgba(12,22,28,.75);backdrop-filter:blur(4px);color:#fff;
  border-radius:7px;padding:3px 7px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis
}

.empty{
  color:var(--mute);padding:28px 20px;border:1px dashed var(--line);
  border-radius:14px;text-align:center;background:color-mix(in srgb,var(--panel) 65%,transparent)
}

dialog{
  border:1px solid var(--line);border-radius:16px;background:var(--panel);
  color:var(--ink);padding:22px;width:min(520px,94vw);max-height:90vh;box-shadow:var(--shadow-lg)
}
dialog::backdrop{background:rgba(8,16,22,.65);backdrop-filter:blur(4px)}
.f{display:grid;gap:13px}
.f label{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.pv{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pv>div{position:relative}
.pv img{width:74px;height:74px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.pv .pv-pdf{
  width:136px;height:74px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);
  padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--ink)
}
.pv .pv-pdf span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pv>div>button{
  position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:999px;
  border:0;background:var(--bad);color:#fff;line-height:1;font-size:14px
}

.chk-row{display:flex;align-items:center;gap:8px;font-size:13.5px}
.chk-row input[type="checkbox"]{width:17px;height:17px;margin:0;accent-color:var(--acc)}

.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:9px;border:2px solid transparent}
.sw button.on{border-color:var(--ink);transform:scale(1.08)}

.fl{
  display:flex;align-items:center;gap:12px;background:var(--panel);
  border:1px solid var(--line-soft);border-radius:13px;padding:11px 14px;margin-bottom:9px;flex-wrap:wrap;box-shadow:var(--shadow)
}
.fi{
  flex:none;width:42px;height:42px;border-radius:10px;background:var(--panel-2);
  border:1px solid var(--line);display:grid;place-items:center;font:700 11px 'Bricolage Grotesque',sans-serif;text-transform:uppercase
}
.fn{flex:1;min-width:140px}
.fn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pn{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;
  padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)
}
.pn h3{font-size:15.5px;margin-bottom:12px}
.ff{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;align-items:end}
.ff label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--mute)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.kp div{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow)}
.kp span{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);display:block}
.kp b{font:700 20px 'Bricolage Grotesque',sans-serif;margin-top:4px;display:block}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.cr{margin-bottom:12px}
.cr .meta{justify-content:space-between}
svg.ch{width:100%;height:auto;display:block}

#toast{
  position:fixed;right:18px;bottom:18px;z-index:999;max-width:min(360px,90vw);
  background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:12px;
  font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);
  opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .2s ease,transform .2s ease
}
#toast.show{opacity:1;transform:translateY(0)}

@media (max-width:760px){
  #app{grid-template-columns:1fr}
  aside{
    position:static;height:auto;flex-direction:row;overflow-x:auto;
    border-right:0;border-bottom:1px solid var(--line-soft);padding:10px;align-items:center;gap:6px
  }
  .brand,.side-sep,.sync-badge{display:none}
  .nav{width:auto;white-space:nowrap;flex:none;padding:8px 11px}
  .ghost{margin:0;flex:none;white-space:nowrap}
  .toolbar{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .tabs{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="locked">
<div id="app"><aside id="side"></aside><main id="main"></main></div>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dl"></dialog>
<dialog id="dt"></dialog>
<dialog id="ds"></dialog>
<dialog id="dk"></dialog>
<dialog id="dv"><img id="big" alt="Foto ampliada" style="width:100%;border-radius:10px"><div class="acts" style="margin-top:14px"><button class="btn" id="vc">Fechar</button></div></dialog>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = 'https://byblclubmufznpcjrcsv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hgLz5z_Hr-9MhJ4l3NAL4A_TfGkc8cV';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const COL=['#0E7C86','#C4472F','#6B5BD2','#D08A12','#2F8F4E','#B4408C'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'>','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date());
const fd=d=>d===TODAY?'Hoje':new Date(d+'T00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const sbrl=v=>(v>0?'+':v<0?'−':'')+brl(Math.abs(v||0));

function defaultState(){
  return {
    theme:'auto',
    accent:'',
    updatedAt:0,
    subs:['Polícia Militar','Projeto Theik','Projeto Theik House','Gastos Pessoais','PC Gamer'].map((n,i)=>({id:uid(),name:n,color:COL[i],cats:[]})),
    tasks:[],
    files:[],
    fin:[],
    meta:0,
    trades:[],
    bancaIni:0
  };
}

let S=defaultState();
let currentUser=null;
let syncState='ok';
let syncLabel='Sincronizado';
let view='hoje',mode='tarefas',cur=null,csub=null,delArm=false,fcat='',fm=TODAY.slice(0,7),tm=TODAY.slice(0,7),qtext='',fstatus='all',fpay='',tsetup='';

let toastTm;
function notify(msg){
  const el=$('#toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTm);
  toastTm=setTimeout(()=>el.classList.remove('show'),2600);
}

function setSyncStatus(st,lbl){
  syncState=st;
  syncLabel=lbl;
  const dot=$('.sync-dot'),txt=$('.sync-txt');
  if(dot){dot.className='sync-dot'+(st==='busy'?' busy':st==='err'?' err':'')}
  if(txt)txt.textContent=lbl;
}

/* ================= ANEXOS DE TAREFA (IMAGENS + PDF) ================= */
function normAtt(item){
  if(typeof item==='string'){
    return {type:'image/jpeg',name:'Imagem',data:item};
  }
  return {
    type:item?.type||'image/jpeg',
    name:item?.name||'Anexo',
    data:item?.data||''
  };
}
const isPdfAtt=item=>normAtt(item).type==='application/pdf'||/\.pdf$/i.test(normAtt(item).name);
const isImgAtt=item=>!isPdfAtt(item);

function openPdfData(dataUrl,name='documento.pdf'){
  const blob=d2b(dataUrl);
  const url=URL.createObjectURL(blob);
  const win=window.open(url,'_blank','noopener');
  if(!win){
    triggerDownload(name,blob,'application/pdf');
  }
  setTimeout(()=>URL.revokeObjectURL(url),15000);
}

/* ================= LOGIN & SINCRONIZAÇÃO NUVEM ================= */
function drawLogin(err='',busy=false){
  $('#dl').innerHTML=`<form class="f" id="loginForm">
    <h2>Acesso Privado</h2>
    <p class="sub" style="margin:0">Entre com seu e-mail e senha para carregar seus dados na nuvem.</p>
    <label>E-mail<input id="lemail" type="email" autocomplete="email" required placeholder="seu@email.com"></label>
    <label>Senha<input id="lpass" type="password" autocomplete="current-password" required placeholder="Sua senha"></label>
    ${err?`<p style="color:var(--bad);margin:0;font-size:13px;font-weight:600" role="alert">${esc(err)}</p>`:''}
    <div class="acts">
      <button class="btn pri" type="submit" ${busy?'disabled':''}>${busy?'Entrando...':'Entrar'}</button>
    </div>
  </form>`;
  setTimeout(()=>$('#lemail')?.focus(),20);
}

function updateAuthUI(){
  const logged=Boolean(currentUser);
  document.body.classList.toggle('locked',!logged);
  const dlg=$('#dl');
  if(!logged){
    drawLogin();
    if(!dlg.open)dlg.showModal();
  }else if(dlg.open){
    dlg.close();
  }
}

async function cloudPull(){
  if(!currentUser)return null;
  setSyncStatus('busy','Buscando nuvem...');
  const{data,error}=await supabase
    .from('user_state')
    .select('state,updated_at')
    .eq('user_id',currentUser.id)
    .maybeSingle();

  if(error){
    setSyncStatus('err','Erro ao sincronizar');
    notify('Erro ao buscar dados da nuvem.');
    return null;
  }
  setSyncStatus('ok','Nuvem conectada');
  return data?.state||null;
}

async function cloudPush(){
  if(!currentUser)return;
  setSyncStatus('busy','Salvando na nuvem...');
  const{error}=await supabase
    .from('user_state')
    .upsert({
      user_id:currentUser.id,
      state:S,
      updated_at:new Date().toISOString()
    },{onConflict:'user_id'});

  if(error){
    setSyncStatus('err','Falha ao salvar na nuvem');
    notify('Erro ao salvar na nuvem: '+error.message);
  }else{
    setSyncStatus('ok','Sincronizado');
  }
}

async function syncAfterLogin(){
  const localData=await loadLocal();
  const cloudData=await cloudPull();

  if(cloudData&&Array.isArray(cloudData.subs)){
    const localTs=localData?.updatedAt||0;
    const cloudTs=cloudData?.updatedAt||0;
    if(localData&&Array.isArray(localData.subs)&&localTs>cloudTs){
      S=localData;
      mig();
      await cloudPush();
    }else{
      S=cloudData;
      mig();
      await saveLocalOnly();
    }
  }else if(localData&&Array.isArray(localData.subs)){
    S=localData;
    mig();
    await cloudPush();
  }else{
    S=defaultState();
    S.updatedAt=Date.now();
    await saveLocalOnly();
    await cloudPush();
  }

  applyAcc();
  applyTheme();
  render();
}

/* ================= CACHE LOCAL (INDEXEDDB) ================= */
const idb=()=>new Promise((res,rej)=>{
  try{
    const r=indexedDB.open('central_v2',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  }catch(e){rej(e)}
});

function localKey(){
  return currentUser?'s_'+currentUser.id:'s_guest';
}

async function loadLocal(){
  try{
    const db=await idb();
    return await new Promise(res=>{
      const q=db.transaction('kv').objectStore('kv').get(localKey());
      q.onsuccess=()=>res(q.result);
      q.onerror=()=>res(null);
    });
  }catch(e){return null}
}

async function saveLocalOnly(){
  try{
    const db=await idb();
    db.transaction('kv','readwrite').objectStore('kv').put(S,localKey());
  }catch(e){}
}

let timerSave;
function save(){
  S.updatedAt=Date.now();
  clearTimeout(timerSave);
  timerSave=setTimeout(async()=>{
    await saveLocalOnly();
    await cloudPush();
  },350);
}

const isTrade=s=>/theik$/i.test((s?.name||'').trim())||/^projeto theik$/i.test((s?.name||'').trim());

function defaultModeFor(s){
  if(isTrade(s))return 'trades';

}

/* ================= LÓGICA PRINCIPAL ================= */
const sub=id=>S.subs.find(s=>s.id===id)||{name:'Geral',color:'#888',cats:[]};
const pend=id=>S.tasks.filter(t=>!t.done&&(!id||t.sub===id)).length;

function shrink(f){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const k=Math.min(1,900/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*k));
        c.height=Math.max(1,Math.round(im.height*k));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',.72));
      };
      im.onerror=()=>res(null);
      im.src=r.result;
    };
    r.onerror=()=>res(null);
    r.readAsDataURL(f);
  });
}

async function processTaskAttachment(f){
  const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);
  if(isPdf){
    if(f.size>5242880){
      notify('PDF acima de 5 MB: '+f.name);
      return null;
    }
    const data=await rd(f);
    if(!data)return null;
    return {type:'application/pdf',name:f.name,data};
  }
  const imgData=await shrink(f);
  if(!imgData)return null;
  return {type:'image/jpeg',name:f.name||'Imagem',data:imgData};
}

const cmp=(a,b)=>(a.date||'9')+(a.time||'99')<(b.date||'9')+(b.time||'99')?-1:1;

function matchTask(t){
  if(fstatus==='open'&&t.done)return false;
  if(fstatus==='done'&&!t.done)return false;
  if(qtext){
    const q=qtext.toLowerCase();
    const attNames=(t.photos||[]).map(x=>normAtt(x).name);
    const hay=[t.title,t.note,t.cat,sub(t.sub).name,...(t.subs||[]).map(x=>x.text),...attNames].join(' ').toLowerCase();
    if(!hay.includes(q))return false;
  }
  return true;
}

      <button class="chk" data-c="${t.id}" aria-label="Marcar como cumprida">${t.done?'✓':''}</button>
      <button class="tb" data-t="${t.id}">
        <div class="tt">${esc(t.title)}</div>
        <div class="meta">
          ${showSub?`<span class="chip"><i style="background:${sub(t.sub).color}"></i>${esc(sub(t.sub).name)}</span>`:''}
          ${t.date&&n!=='Hoje'?`<span>${fd(t.date)}</span>`:''}
          ${t.cat?`<span class="pill-tag">#${esc(t.cat)}</span>`:''}
          ${t.time?`<span>${t.time}</span>`:''}
          ${Number(t.val)>0?`<span>${brl(t.val)}</span>`:''}
          ${subs.length?`<span>✓ ${subDone}/${subs.length}</span>`:''}
          ${t.note?`<span>${esc(t.note.slice(0,65))}</span>`:''}
        </div>

  else if(id==='pz')openPz();

  else if(id==='tx')$('#dt').close();

  else if(id==='vc')$('#dv').close();
  else if(id==='tsv'){
    grab();
    const{isNew,...t}=cur;
    const i=S.tasks.findIndex(x=>x.id===t.id);
    if(i>=0)S.tasks[i]=t;
    save();$('#dt').close();render();notify('Tarefa salva.');
  }
  else if(id==='tdel'){
    if(!delArm){grab();delArm=true;drawT()}
    else{S.tasks=S.tasks.filter(x=>x.id!==cur.id);save();$('#dt').close();render();notify('Tarefa excluída.')}
  }
  else if(id==='ssv'){
    csub.name=$('#sn').value.trim()||'Novo assunto';
    csub.cats=$('#sc').value.split(',').map(x=>x.trim()).filter(Boolean);
    const{isNew,...s}=csub;
    if(isNew){S.subs.push(s);view=s.id;mode=defaultModeFor(s);notify('Assunto criado.')}
    else{S.subs[S.subs.findIndex(x=>x.id===s.id)]=s;notify('Assunto atualizado.')}
    save();$('#ds').close();render();
  }
  else if(id==='sdel'){
    if(!delArm){csub.name=$('#sn').value;delArm=true;drawS()}
    else{
      S.tasks=S.tasks.filter(t=>t.sub!==csub.id);
      S.files=S.files.filter(f=>f.sub!==csub.id);
      S.subs=S.subs.filter(s=>s.id!==csub.id);
      view='hoje';save();$('#ds').close();render();notify('Assunto removido.');
    }
  }
});

function triggerDownload(filename,blobOrString,mime='application/json'){
  const blob=blobOrString instanceof Blob?blobOrString:new Blob([blobOrString],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

async function exportBk(){
  const m=$('#bm');
  const fname='central-backup-'+TODAY+'.json';
  const payload=JSON.stringify(S,null,2);
  triggerDownload(fname,payload,'application/json');
  m.textContent='Backup baixado ('+fname+').';notify('Backup exportado!');
}

async function restoreBk(f){
  const m=$('#bm');if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.subs)||!Array.isArray(d.tasks))throw new Error('Estrutura inválida');
    S=d;mig();applyAcc();applyTheme();save();view='hoje';render();
    m.textContent='Dados restaurados e enviados à nuvem: '+d.subs.length+' assuntos e '+d.tasks.length+' tarefas.';
    notify('Backup restaurado com sucesso!');
  }catch(e){
    m.textContent='Arquivo inválido. Escolha um backup .json exportado pela Central de Controle.';
  }
}

const rd=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(f)});
const d2b=u=>{const[h,b]=u.split(','),bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.slice(5).split(';')[0]})};

async function addFiles(L){
  let ok=0,big=[];
  for(const f of L){
    if(f.size>5242880){big.push(f.name);continue}
    const data=await rd(f);if(!data)continue;
    S.files.push({id:uid(),sub:view,name:f.name,type:f.type||'application/octet-stream',size:f.size,date:TODAY,data});
    ok++;
  }
  save();render();
  const msg=(ok?ok+' arquivo(s) guardado(s). ':'')+(big.length?'Excede 5 MB: '+big.join(', '):'');
  if($('#fm'))$('#fm').textContent=msg;
  if(ok)notify(ok+' arquivo(s) salvo(s).');
}

async function saveFile(id){
  const f=S.files.find(x=>x.id===id),m=$('#fm');
  if(!f)return;
  const blob=d2b(f.data);
  triggerDownload(f.name,blob,f.type||'application/octet-stream');
  if(m)m.textContent='Arquivo baixado.';notify('Download concluído.');
}

function addTrade(){
  const raw=Math.abs(parseFloat($('#trval').value));
  if(!(raw>0)){$('#trval').focus();notify('Informe o valor em R$ do trade.');return}
  const resType=$('#trres').value;
  const val=Math.round((resType==='loss'?-raw:raw)*100)/100;
  const date=$('#trdate').value||TODAY;
  const ptsRaw=parseFloat($('#trpts').value);
  const pts=isNaN(ptsRaw)?0:(resType==='loss'?-Math.abs(ptsRaw):Math.abs(ptsRaw));

  S.trades.push({
    id:uid(),
    date,
    asset:'WIN',
    side:$('#trside').value,
    cts:Math.max(1,parseInt($('#trcts').value,10)||1),
    pts,
    val,
    setup:$('#trsetup').value.trim()||'Geral',
    note:$('#trnote').value.trim()
  });

  tm=date.slice(0,7);
  tsetup='';
  save();
  render();
  notify(val>=0?'Gain registrado!':'Loss registrado.');
  $('#trval')?.focus();
}

function tradesView(){
  const Y=+tm.slice(0,4),Mo=+tm.slice(5),nd=new Date(Y,Mo,0).getDate();
  const all=[...(S.trades||[])].sort((a,b)=>a.date===b.date?0:(a.date<b.date?-1:1));
  const M=all.filter(x=>x.date.slice(0,7)===tm);

  const bancaIni=Number(S.bancaIni)||0;
  const acumTotal=all.reduce((a,x)=>a+x.val,0);
  const patrimonioAtual=bancaIni+acumTotal;

  const resMes=M.reduce((a,x)=>a+x.val,0);
  const ptsMes=M.reduce((a,x)=>a+(Number(x.pts)||0),0);
  const gains=M.filter(x=>x.val>0);
  const losses=M.filter(x=>x.val<0);
  const winRate=M.length?Math.round((gains.length/M.length)*100):0;
  const avgGain=gains.length?gains.reduce((a,x)=>a+x.val,0)/gains.length:0;
  const avgLoss=losses.length?Math.abs(losses.reduce((a,x)=>a+x.val,0)/losses.length):0;
  const payoff=avgLoss>0?(avgGain/avgLoss).toFixed(2):(gains.length?'∞':'0.00');

  const curvePts=[{label:'Início',val:bancaIni}];
  let run=bancaIni;
  all.forEach((t,idx)=>{
    run=Math.round((run+t.val)*100)/100;
    curvePts.push({label:`#${idx+1} (${t.date.slice(8)}/${t.date.slice(5,7)})`,val:run});
  });

  let equitySvg='';
  if(curvePts.length>1){
    const vals=curvePts.map(p=>p.val);
    const minV=Math.min(...vals);
    const maxV=Math.max(...vals);
    const span=Math.max(1,maxV-minV);
    const padX=14,padY=18,W=600,H=155;
    const coords=curvePts.map((p,i)=>{
      const x=padX+(i/(curvePts.length-1))*(W-padX*2);
      const y=H-padY-((p.val-minV)/span)*(H-padY*2);
      return [x,y,p];
    });
    const poly=coords.map(c=>`${c[0].toFixed(1)},${c[1].toFixed(1)}`).join(' ');
    const area=`${coords[0][0].toFixed(1)},${H-padY} ${poly} ${coords[coords.length-1][0].toFixed(1)},${H-padY}`;
    const lineCol=patrimonioAtual>=bancaIni?'var(--ok)':'var(--bad)';
    const baseY=H-padY-((bancaIni-minV)/span)*(H-padY*2);

    equitySvg=`<svg class="ch" viewBox="0 0 ${W} ${H+14}" role="img" aria-label="Curva de capital acumulada">
      <line x1="${padX}" x2="${W-padX}" y1="${baseY.toFixed(1)}" y2="${baseY.toFixed(1)}" stroke-dasharray="4 4" style="stroke:var(--mute);opacity:.55"/>
      <polygon points="${area}" style="fill:${lineCol};opacity:.12"/>
      <polyline fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" points="${poly}" style="stroke:${lineCol}"/>
      ${coords.length<=35?coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.2" style="fill:${lineCol}"><title>${esc(c[2].label)}: ${brl(c[2].val)}</title></circle>`).join(''):''}
      <text x="${W-padX}" y="12" text-anchor="end" style="fill:var(--mute);font-size:10px">Topo: ${brl(maxV)} · Base: ${brl(bancaIni)}</text>
      <text x="${padX}" y="${H+8}" style="fill:var(--mute);font-size:10px">Início (${brl(bancaIni)})</text>
      <text x="${W-padX}" y="${H+8}" text-anchor="end" style="fill:var(--mute);font-size:10px">Atual (${brl(patrimonioAtual)})</text>
    </svg>`;
  }else{
    equitySvg='<div class="empty">Lance seu primeiro trade de Mini Índice para visualizar a curva de evolução do patrimônio.</div>';
  }

  const dayNet=Array.from({length:nd},()=>0);
  M.forEach(x=>{dayNet[+x.date.slice(8)-1]+=x.val});
  const maxAbs=Math.max(1,...dayNet.map(v=>Math.abs(v)));
  const bw=600/nd,midY=68;
  const dayBars=dayNet.map((v,i)=>{
    if(!v)return ((i+1)%5===0||i===0?`<text x="${i*bw+bw/2}" y="142" text-anchor="middle" style="fill:var(--mute);font-size:10px">${i+1}</text>`:'');
    const h=Math.max(3,(Math.abs(v)/maxAbs)*50);
    const y=v>=0?midY-h:midY;
    const col=v>=0?'var(--ok)':'var(--bad)';
    return `<rect x="${i*bw+bw*.16}" y="${y}" width="${bw*.68}" height="${h}" rx="2" style="fill:${col}"><title>Dia ${i+1}: ${sbrl(v)}</title></rect>`+
           ((i+1)%5===0||i===0?`<text x="${i*bw+bw/2}" y="142" text-anchor="middle" style="fill:var(--mute);font-size:10px">${i+1}</text>`:'');
  }).join('');

  const bySetup={};
  M.forEach(x=>{bySetup[x.setup]=(bySetup[x.setup]||0)+x.val});
  const setupEntries=Object.entries(bySetup).sort((a,b)=>b[1]-a[1]);
  const maxSetupAbs=Math.max(1,...setupEntries.map(x=>Math.abs(x[1])));
  const allSetups=[...new Set(SETUPS.concat(all.map(x=>x.setup)))];
  const filteredTrades=M.filter(x=>!tsetup||x.setup===tsetup).slice().reverse();

  return `
  <div class="pn">
    <h3>Banca & Acumulado Geral (WIN)</h3>
    <div class="ff" style="margin-bottom:14px">
      <label>Saldo inicial da banca (R$)<input id="tbanca" type="number" step="0.01" value="${S.bancaIni||''}" placeholder="Ex: 2000,00"></label>
    </div>
    <div class="kp" style="margin-bottom:0">
      <div><span>Saldo Inicial</span><b>${brl(bancaIni)}</b></div>
      <div><span>Acumulado Total</span><b style="color:${acumTotal>=0?'var(--ok)':'var(--bad)'}">${sbrl(acumTotal)}</b></div>
      <div><span>Patrimônio Atual</span><b style="color:${patrimonioAtual>=bancaIni?'var(--ok)':'var(--bad)'}">${brl(patrimonioAtual)}</b></div>
      <div><span>Total de Operações</span><b>${all.length}</b></div>
    </div>
  </div>

  <div class="pn"><h3>Registrar trade (Mini Índice - WIN)</h3><div class="ff">
    <label>Resultado<select id="trres"><option value="gain">Gain (+)</option><option value="loss">Loss (−)</option></select></label>
    <label>Valor líquido (R$)<input id="trval" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00"></label>
    <label>Direção<select id="trside"><option value="Compra">Compra</option><option value="Venda">Venda</option></select></label>
    <label>Contratos<input id="trcts" type="number" min="1" step="1" value="1"></label>
    <label>Pontos (opcional)<input id="trpts" type="number" step="5" placeholder="Ex: 250"></label>
    <label>Estratégia / Setup<input id="trsetup" list="tsetuplist" placeholder="Ex: Pullback"><datalist id="tsetuplist">${allSetups.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></label>
    <label>Data<input id="trdate" type="date" value="${TODAY}"></label>
    <label>Observação<input id="trnote" placeholder="Opcional"></label>
    <button class="btn pri" type="button" id="tadd">Lançar trade</button>
  </div></div>

  <div class="pn"><h3>Curva de Capital (Patrimônio Acumulado)</h3>
    ${equitySvg}
  </div>

  <div class="head" style="align-items:center;margin-bottom:12px">
    <button class="tab" type="button" data-tm="-1" aria-label="Mês anterior">‹</button>
    <h2 style="text-transform:capitalize">${new Date(Y,Mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2>
    <button class="tab" type="button" data-tm="1" aria-label="Próximo mês">›</button>
  </div>

  <div class="kp">
    <div><span>Resultado do Mês</span><b style="color:${resMes>=0?'var(--ok)':'var(--bad)'}">${sbrl(resMes)}</b></div>
    <div><span>Taxa de Acerto</span><b>${winRate}% <small style="font-size:12px;color:var(--mute)">(${gains.length}G / ${losses.length}L)</small></b></div>
    <div><span>Payoff (Média G/L)</span><b>${payoff}</b></div>
    <div><span>Saldo de Pontos</span><b style="color:${ptsMes>=0?'var(--ok)':'var(--bad)'}">${ptsMes>0?'+':''}${ptsMes} pts</b></div>
  </div>

  <div class="pn"><h3>Resultado diário no mês</h3>
    <div class="lg"><span><i style="background:var(--ok)"></i>Dia positivo</span><span><i style="background:var(--bad)"></i>Dia negativo</span></div>
    <svg class="ch" viewBox="0 0 600 148" role="img" aria-label="Resultado diário de trades no mês">
      <line x1="0" x2="600" y1="${midY}" y2="${midY}" style="stroke:var(--line)"/>
      <text x="596" y="12" text-anchor="end" style="fill:var(--mute);font-size:9px">amplitude máx: ±${brl(maxAbs)}</text>
      ${dayBars}
    </svg>
  </div>

  <div class="pn"><h3>Desempenho por Estratégia / Setup</h3>
    ${setupEntries.length?setupEntries.map(([st,v])=>`<div class="cr">
      <div class="meta"><span>${esc(st)}</span><b style="color:${v>=0?'var(--ok)':'var(--bad)'}">${sbrl(v)}</b></div>
      <div class="bar"><i style="width:${Math.round((Math.abs(v)/maxSetupAbs)*100)}%;background:${v>=0?'var(--ok)':'var(--bad)'}"></i></div>
    </div>`).join(''):'<div class="empty">Nenhum trade registrado neste mês.</div>'}
  </div>

  <div class="pn">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <h3 style="margin:0">Histórico de Trades do Mês</h3>
      <div class="tabs" style="margin-left:0">
        <button class="tab ${!tsetup?'on':''}" data-tsetup="">Todos</button>
        ${[...new Set(M.map(x=>x.setup))].map(st=>`<button class="tab ${tsetup===st?'on':''}" data-tsetup="${esc(st)}">${esc(st)}</button>`).join('')}
      </div>
    </div>
    ${filteredTrades.length?filteredTrades.map(x=>`<div class="task" style="align-items:center">
      <div class="meta" style="min-width:44px;margin:0">${x.date.slice(8)}/${x.date.slice(5,7)}</div>
      <div class="tb">
        <div class="tt">WIN · ${esc(x.side)} (${x.cts} ct${x.cts>1?'s':''}) ${x.pts?`· ${x.pts>0?'+':''}${x.pts} pts`:''}</div>
        <div class="meta">
          <span class="pill-tag">${esc(x.setup)}</span>
          ${x.note?`<span>${esc(x.note)}</span>`:''}
        </div>
      </div>
      <b style="color:${x.val>=0?'var(--ok)':'var(--bad)'};white-space:nowrap">${sbrl(x.val)}</b>
      <button class="btn bad" type="button" data-tdel="${x.id}" aria-label="Excluir trade">×</button>
    </div>`).join(''):'<div class="empty">Nenhum trade encontrado para este filtro.</div>'}
  </div>`;
}

/* ================= INICIALIZAÇÃO ================= */
(async()=>{
  const{data}=await supabase.auth.getSession();
  currentUser=data?.session?.user||null;
  updateAuthUI();
  if(currentUser){
    await syncAfterLogin();
  }else{
    render();
  }
})();
</script>
</body>
</html>
